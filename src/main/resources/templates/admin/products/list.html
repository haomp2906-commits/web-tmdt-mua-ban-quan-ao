<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý sản phẩm - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-layout">

        <div th:replace="~{fragments/admin-panel :: admin-sidebar}"></div>

        <div class="admin-main">

            <div th:replace="~{fragments/admin-panel :: admin-topbar}"></div>

            <main class="admin-page">

                <div th:if="${success}"
                     class="alert alert-success"
                     th:text="${success}">
                </div>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="admin-eyebrow">SẢN PHẨM</p>
                        <h1 class="mb-0">Quản lý sản phẩm</h1>
                    </div>

                    <a th:href="@{/admin/products/create}"
                       class="btn btn-primary">
                        Thêm sản phẩm
                    </a>
                </div>

                <form th:action="@{/admin/products}"
                      method="get"
                      class="filter-panel mb-4">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Nhập tên sản phẩm..."
                                   th:value="${keyword}">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Danh mục</label>
                            <select name="categoryId" class="form-select">
                                <option value="">Tất cả danh mục</option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${category.id == categoryId}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="">Tất cả trạng thái</option>

                                <option value="ACTIVE"
                                        th:selected="${status == 'ACTIVE'}">
                                    Đang bán
                                </option>

                                <option value="INACTIVE"
                                        th:selected="${status == 'INACTIVE'}">
                                    Không hoạt động
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Giá từ</label>
                            <input type="number"
                                   name="minPrice"
                                   min="0"
                                   class="form-control"
                                   placeholder="0"
                                   th:value="${minPrice}">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Giá đến</label>
                            <input type="number"
                                   name="maxPrice"
                                   min="0"
                                   class="form-control"
                                   placeholder="Không giới hạn"
                                   th:value="${maxPrice}">
                        </div>

                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-dark">
                                Tìm kiếm
                            </button>

                            <a th:href="@{/admin/products}"
                               class="btn btn-secondary">
                                Xóa bộ lọc
                            </a>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle mb-0">
                                <thead class="table-dark">
                                <tr>
                                    <th style="width: 70px;">ID</th>
                                    <th style="width: 120px;">Ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Giá giảm</th>
                                    <th>Màu</th>
                                    <th>Trạng thái</th>
                                    <th style="width: 220px;">Thao tác</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="product : ${products}">
                                    <td th:text="${product.id}"></td>

                                    <td>
										<img th:if="${product.thumbnail != null}"
										     th:src="@{${product.thumbnail}}"
										     alt="Ảnh sản phẩm"
										     loading="lazy"
										     style="width: 70px; height: 70px; object-fit: cover;"
										     class="img-thumbnail">

                                        <span th:if="${product.thumbnail == null}"
                                              class="text-muted">
                                            Chưa có ảnh
                                        </span>
                                    </td>

                                    <td th:text="${product.name}"></td>

                                    <td th:text="${product.category != null ? product.category.name : 'Chưa có'}"></td>

                                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                                    <td>
                                        <span th:if="${product.discountPrice != null}"
                                              th:text="${#numbers.formatDecimal(product.discountPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </span>

                                        <span th:if="${product.discountPrice == null}">-</span>
                                    </td>

                                    <td th:text="${product.color}"></td>

                                    <td>
                                        <span th:if="${product.status == 'ACTIVE'}"
                                              class="badge bg-success">
                                            Đang bán
                                        </span>

                                        <span th:unless="${product.status == 'ACTIVE'}"
                                              class="badge bg-secondary">
                                            Không hoạt động
                                        </span>
                                    </td>

                                    <td>
                                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                                           class="btn btn-sm btn-warning">
                                            Sửa
                                        </a>
										
										<a th:href="@{/admin/products/{id}/variants(id=${product.id})}"
										   class="btn btn-sm btn-info text-white">
										    Tồn kho
										</a>
										
                                        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
                                              method="post"
                                              class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-sm btn-danger"
                                                    onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">
                                                Xóa
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(products)}">
                                    <td colspan="9" class="text-center text-muted">
                                        Chưa có sản phẩm nào.
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>

            <footer class="admin-footer">
                © 2026 Rùa Fashion Store. Bản quyền thuộc về Trần Quang Hào
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
