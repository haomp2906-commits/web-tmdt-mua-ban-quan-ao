<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form sản phẩm - Rùa Fashion Store</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            Rùa Fashion Store - Admin
        </a>

        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-light" type="submit">Đăng xuất</button>
        </form>
    </div>
</nav>

<div class="container py-4">

    <div class="card shadow">
        <div class="card-body">
            <h2 class="mb-4"
                th:text="${product.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}">
                Form sản phẩm
            </h2>

			<form th:action="@{/admin/products/save}"
			      th:object="${product}"
			      method="post"
			      enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Danh mục</label>
                    <select class="form-select" th:field="*{category}" required>
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control"
                              rows="4"
                              th:field="*{description}">
                    </textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giá bán</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{price}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giá giảm</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{discountPrice}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Thương hiệu</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{brand}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Màu sắc</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{color}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Chất liệu</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{material}">
                    </div>
                </div>

				<div class="mb-3">
				    <label class="form-label">Upload ảnh sản phẩm</label>
				    <input type="file"
				           class="form-control"
				           name="imageFiles"
				           multiple
				           accept="image/*">
				    <small class="text-muted">
				        Có thể chọn nhiều ảnh cùng lúc. Ảnh đầu tiên sẽ được dùng làm ảnh đại diện.
				    </small>
				</div>

				<div class="mb-3" th:if="${product.thumbnail != null}">
				    <label class="form-label">Ảnh đại diện hiện tại</label><br>
				    <img th:src="@{${product.thumbnail}}"
				         alt="Thumbnail"
				         style="width: 150px; height: 150px; object-fit: cover;"
				         class="img-thumbnail">
				</div>

                <div class="mb-3">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Đang bán</option>
                        <option value="INACTIVE">Đã ẩn</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Lưu
                </button>

                <a th:href="@{/admin/products}" class="btn btn-secondary">
                    Quay lại
                </a>
            </form>
        </div>
    </div>

</div>

</body>
</html>
