<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form biến thể - Rùa Fashion Store</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            Rùa Fashion Store - Admin
        </a>

        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-light" type="submit">
                Đăng xuất
            </button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <div class="card shadow">
        <div class="card-body">

            <h2 class="mb-2"
                th:text="${variantRequest.id == null
                    ? 'Thêm biến thể sản phẩm'
                    : 'Sửa biến thể sản phẩm'}">
            </h2>

            <p class="text-muted mb-4">
                Sản phẩm:
                <strong th:text="${product.name}"></strong>
            </p>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/admin/products/{id}/variants/save(id=${product.id})}"
                  th:object="${variantRequest}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Size</label>

                    <select class="form-select"
                            th:field="*{sizeId}"
                            required>

                        <option value="">-- Chọn size --</option>

                        <option th:each="size : ${sizes}"
                                th:value="${size.id}"
                                th:text="${size.name}">
                        </option>
                    </select>

                    <small class="text-danger"
                           th:errors="*{sizeId}">
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Màu sắc</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{color}"
                           placeholder="Ví dụ: Trắng, Đen, Xanh"
                           required>

                    <small class="text-danger"
                           th:errors="*{color}">
                    </small>
                </div>

                <div class="mb-4">
                    <label class="form-label">Số lượng tồn kho</label>

                    <input type="number"
                           min="0"
                           class="form-control"
                           th:field="*{quantity}"
                           required>

                    <small class="text-danger"
                           th:errors="*{quantity}">
                    </small>
                </div>

                <button type="submit" class="btn btn-primary">
                    Lưu biến thể
                </button>

                <a th:href="@{/admin/products/{id}/variants(id=${product.id})}"
                   class="btn btn-secondary">
                    Quay lại
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
