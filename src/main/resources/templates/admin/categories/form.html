<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Form danh mục - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-layout">

        <div th:replace="~{fragments/admin-panel :: admin-sidebar}"></div>

        <div class="admin-main">

            <div th:replace="~{fragments/admin-panel :: admin-topbar}"></div>

            <main class="admin-page">

                <a th:href="@{/admin/categories}"
                   class="btn btn-outline-secondary btn-sm mb-4">
                    ← Quay lại danh sách danh mục
                </a>

                <div class="mb-4">
                    <p class="admin-eyebrow">DANH MỤC</p>
                    <h1 class="mb-0"
                        th:text="${category.id == null ? 'Thêm danh mục' : 'Sửa danh mục'}">
                        Form danh mục
                    </h1>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">

                        <form th:action="@{/admin/categories/save}"
                              th:object="${category}"
                              method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label">Tên danh mục</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{name}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Slug</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{slug}"
                                       placeholder="Có thể để trống để hệ thống tự tạo">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control"
                                          rows="4"
                                          th:field="*{description}"></textarea>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{status}">
                                <label class="form-check-label">
                                    Đang hoạt động
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Lưu
                            </button>

                            <a th:href="@{/admin/categories}"
                               class="btn btn-secondary">
                                Quay lại
                            </a>
                        </form>

                    </div>
                </div>

            </main>

            <footer class="admin-footer">
                © 2026 Rùa Fashion Store. Bản quyền thuộc về Trần Quang Hào
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
