<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý danh mục - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-layout">

        <div th:replace="~{fragments/admin-panel :: admin-sidebar}"></div>

        <div class="admin-main">

            <div th:replace="~{fragments/admin-panel :: admin-topbar}"></div>

            <main class="admin-page">

                <div th:if="${success}"
                     class="alert alert-success"
                     th:text="${success}">
                </div>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="admin-eyebrow">DANH MỤC</p>
                        <h1 class="mb-0">Quản lý danh mục</h1>
                    </div>

                    <a th:href="@{/admin/categories/create}"
                       class="btn btn-primary">
                        Thêm danh mục
                    </a>
                </div>

                <form th:action="@{/admin/categories}"
                      method="get"
                      class="filter-panel mb-4">

                    <div class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label">Tìm danh mục</label>
                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Nhập tên danh mục..."
                                   th:value="${keyword}">
                        </div>

                        <div class="col-md-4 d-flex gap-2">
                            <button type="submit" class="btn btn-dark">
                                Tìm kiếm
                            </button>

                            <a th:href="@{/admin/categories}"
                               class="btn btn-secondary">
                                Xóa bộ lọc
                            </a>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle mb-0">
                                <thead class="table-dark">
                                <tr>
                                    <th style="width: 80px;">ID</th>
                                    <th>Tên danh mục</th>
                                    <th>Slug</th>
                                    <th>Mô tả</th>
                                    <th>Trạng thái</th>
                                    <th style="width: 180px;">Thao tác</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="category : ${categories}">
                                    <td th:text="${category.id}"></td>
                                    <td th:text="${category.name}"></td>
                                    <td th:text="${category.slug}"></td>
                                    <td th:text="${category.description}"></td>
                                    <td>
                                        <span th:if="${category.status}"
                                              class="badge bg-success">
                                            Đang hoạt động
                                        </span>
                                        <span th:unless="${category.status}"
                                              class="badge bg-secondary">
                                            Đã ẩn
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                                           class="btn btn-sm btn-warning">
                                            Sửa
                                        </a>

                                        <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                                              method="post"
                                              class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-sm btn-danger"
                                                    onclick="return confirm('Bạn có chắc muốn xóa danh mục này?')">
                                                Xóa
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(categories)}">
                                    <td colspan="6" class="text-center text-muted">
                                        Chưa có danh mục nào.
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>

            <footer class="admin-footer">
                © 2026 Rùa Fashion Store. Bản quyền thuộc về Trần Quang Hào
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
