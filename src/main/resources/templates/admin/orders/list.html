<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý đơn hàng - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="admin-body">

    <div class="admin-layout">

        <div th:replace="~{fragments/admin-panel :: admin-sidebar}"></div>

        <div class="admin-main">

            <div th:replace="~{fragments/admin-panel :: admin-topbar}"></div>

            <main class="admin-page">

                <div th:if="${success}"
                     class="alert alert-success"
                     th:text="${success}">
                </div>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <div class="mb-4">
                    <p class="admin-eyebrow">ĐƠN HÀNG</p>
                    <h1 class="mb-0">Quản lý đơn hàng</h1>
                </div>

                <form th:action="@{/admin/orders}"
                      method="get"
                      class="filter-panel mb-4">

                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Lọc theo trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="">Tất cả</option>
                                <option value="PENDING"
                                        th:selected="${currentStatus == 'PENDING'}">
                                    Chờ xử lý
                                </option>
                                <option value="SHIPPING"
                                        th:selected="${currentStatus == 'SHIPPING'}">
                                    Đang giao hàng
                                </option>
                                <option value="COMPLETED"
                                        th:selected="${currentStatus == 'COMPLETED'}">
                                    Hoàn thành
                                </option>
                                <option value="CANCELLED"
                                        th:selected="${currentStatus == 'CANCELLED'}">
                                    Đã hủy
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-dark">
                                Lọc
                            </button>

                            <a th:href="@{/admin/orders}"
                               class="btn btn-secondary">
                                Xóa bộ lọc
                            </a>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle mb-0">
                                <thead class="table-dark">
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Ngày đặt</th>
                                    <th>Khách hàng</th>
                                    <th>Người nhận</th>
                                    <th>SĐT</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th style="width: 120px;">Thao tác</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${'#' + order.id}"></td>
                                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${order.user != null ? order.user.email : '-'}"></td>
                                    <td th:text="${order.recipientName}"></td>
                                    <td th:text="${order.recipientPhone}"></td>
                                    <td class="fw-semibold"
                                        th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    </td>
                                    <td>
                                        <span th:if="${order.status == 'PENDING'}"
                                              class="badge text-bg-warning">
                                            Chờ xử lý
                                        </span>
                                        <span th:if="${order.status == 'SHIPPING'}"
                                              class="badge text-bg-primary">
                                            Đang giao hàng
                                        </span>
                                        <span th:if="${order.status == 'COMPLETED'}"
                                              class="badge text-bg-success">
                                            Hoàn thành
                                        </span>
                                        <span th:if="${order.status == 'CANCELLED'}"
                                              class="badge text-bg-danger">
                                            Đã hủy
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                           class="btn btn-sm btn-primary">
                                            Chi tiết
                                        </a>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(orders)}">
                                    <td colspan="8" class="text-center text-muted">
                                        Chưa có đơn hàng nào.
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>

            <footer class="admin-footer">
                © 2026 Rùa Fashion Store. Bản quyền thuộc về Trần Quang Hào
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
