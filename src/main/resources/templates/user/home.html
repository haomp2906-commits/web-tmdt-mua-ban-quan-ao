<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Trang chủ - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

	<div th:replace="~{fragments/header :: header}"></div>

    <section class="hero-section">
        <div class="container text-center">
            <p class="fw-semibold mb-2">
                Rùa Fashion Store
            </p>

            <h1>Phong cách của bạn, lựa chọn của bạn</h1>

            <p class="lead mt-3">
                Khám phá những sản phẩm thời trang phù hợp với phong cách hằng ngày.
            </p>

			<a th:href="@{/products}" class="btn btn-light btn-lg mt-3">
			    Xem sản phẩm
			</a>
        </div>
    </section>

    <main class="container py-5">

        <div class="text-center mb-4">
            <h2>Danh mục nổi bật</h2>

        </div>

		<div class="row g-4">

		    <div
		        class="col-12"
		        th:if="${#lists.isEmpty(featuredProducts)}">

		        <div class="alert alert-info text-center">
		            Hiện chưa có sản phẩm nổi bật.
		        </div>
		    </div>

		    <div
		        class="col-md-6 col-lg-4"
		        th:each="product : ${featuredProducts}">

		        <div class="card product-card shadow-sm h-100">

		            <img
		                th:if="${product.thumbnail != null
		                    and #strings.startsWith(product.thumbnail, '/uploads')}"
		                th:src="@{${product.thumbnail}}"
		                th:alt="${product.name}"
						loading="lazy"
		                class="product-image card-img-top">

		            <div
		                th:if="${product.thumbnail == null
		                    or !#strings.startsWith(product.thumbnail, '/uploads')}"
		                class="no-product-image">

		                Chưa có ảnh
		            </div>

		            <div class="card-body d-flex flex-column">
		                <p
		                    class="text-muted small mb-2"
		                    th:text="${product.category != null
		                        ? product.category.name
		                        : 'Chưa phân loại'}">
		                </p>

		                <h5
		                    class="card-title"
		                    th:text="${product.name}">
		                </h5>

		                <p
		                    class="card-text text-muted product-description"
		                    th:text="${product.description}">
		                </p>

		                <div class="mt-auto">
		                    <p
		                        class="text-decoration-line-through text-muted mb-1"
		                        th:if="${product.discountPrice != null
		                            and product.discountPrice > 0}"
		                        th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
		                    </p>

		                    <h5
		                        class="text-danger fw-bold"
		                        th:text="${#numbers.formatDecimal(
		                            product.discountPrice != null
		                            and product.discountPrice > 0
		                            ? product.discountPrice
		                            : product.price,
		                            0, 'COMMA', 0, 'POINT')} + ' đ'">
		                    </h5>

							<a th:href="@{/products/{id}(id=${product.id})}"
							    class="btn btn-primary w-100">

							    Xem chi tiết
							</a>
		                </div>
		            </div>
		        </div>
		    </div>

		</div>
    </main>

    <footer class="footer text-center">
        <div class="container">
			© 2026 Rùa Fashion Store. Bản quyền thuộc về Trần Quang Hào
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
