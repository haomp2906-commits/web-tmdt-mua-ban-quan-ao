<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đặt hàng thành công - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="text-success">
                                Đặt hàng thành công!
                            </h1>

                            <p class="text-muted mb-0">
                                Cảm ơn bạn đã mua sắm tại Rùa Fashion Store.
                            </p>
                        </div>

                        <div class="alert alert-success">
                            Mã đơn hàng của bạn là:
                            <strong th:text="${'#' + order.id}"></strong>
                        </div>

                        <h5 class="mb-3">Thông tin đơn hàng</h5>

                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <tbody>
                                    <tr>
                                        <th style="width: 40%;">Ngày đặt</th>
                                        <td th:text="${#temporals.format(
                                                order.createdAt,
                                                'dd/MM/yyyy HH:mm'
                                            )}">
                                        </td>
                                    </tr>

                                    <tr>
                                        <th>Người nhận</th>
                                        <td th:text="${order.recipientName}"></td>
                                    </tr>

                                    <tr>
                                        <th>Số điện thoại</th>
                                        <td th:text="${order.recipientPhone}"></td>
                                    </tr>

                                    <tr>
                                        <th>Địa chỉ giao hàng</th>
                                        <td th:text="${order.shippingAddress}"></td>
                                    </tr>

                                    <tr>
                                        <th>Phương thức thanh toán</th>
                                        <td th:text="${order.paymentMethod}"></td>
                                    </tr>

                                    <tr>
                                        <th>Trạng thái đơn</th>
                                        <td>
                                            <span
                                                th:if="${order.status == 'PENDING'}"
                                                class="badge text-bg-warning">

                                                Chờ xử lý
                                            </span>

                                            <span
                                                th:if="${order.status == 'SHIPPING'}"
                                                class="badge text-bg-primary">

                                                Đang giao hàng
                                            </span>

                                            <span
                                                th:if="${order.status == 'COMPLETED'}"
                                                class="badge text-bg-success">

                                                Hoàn thành
                                            </span>

                                            <span
                                                th:if="${order.status == 'CANCELLED'}"
                                                class="badge text-bg-danger">

                                                Đã hủy
                                            </span>
                                        </td>
                                    </tr>

                                    <tr th:if="${order.note != null}">
                                        <th>Ghi chú</th>
                                        <td th:text="${order.note}"></td>
                                    </tr>

                                    <tr>
                                        <th>Tổng tiền</th>
                                        <td class="text-danger fw-bold fs-5">
                                            <span
                                                th:text="${#numbers.formatDecimal(
                                                    order.totalAmount,
                                                    0,
                                                    'COMMA',
                                                    0,
                                                    'POINT'
                                                )} + ' đ'">
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a th:href="@{/products}"
                               class="btn btn-outline-primary">

                                Tiếp tục mua sắm
                            </a>

                            <a th:href="@{/cart}"
                               class="btn btn-primary">

                                Xem giỏ hàng
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
