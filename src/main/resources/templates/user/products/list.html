<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sản phẩm - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <div class="text-center mb-4">
            <h1>Sản phẩm</h1>
            <p class="text-muted">
                Khám phá các sản phẩm thời trang tại Rùa Fashion Store.
            </p>
        </div>

        <form th:action="@{/products}" method="get"
              class="filter-panel mb-5">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Tìm sản phẩm</label>
                    <input
                        type="search"
                        name="keyword"
                        class="form-control"
                        th:value="${keyword}"
                        placeholder="Nhập tên sản phẩm">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Danh mục</label>
                    <select name="categoryId" class="form-select">
                        <option value="">Tất cả danh mục</option>

                        <option
                            th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${categoryId != null and category.id == categoryId}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Giá từ</label>
                    <input
                        type="number"
                        name="minPrice"
                        min="0"
                        step="1000"
                        class="form-control"
                        th:value="${minPrice}"
                        placeholder="0">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Giá đến</label>
                    <input
                        type="number"
                        name="maxPrice"
                        min="0"
                        step="1000"
                        class="form-control"
                        th:value="${maxPrice}"
                        placeholder="1.000.000">
                </div>

                <div class="col-md-1 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        Lọc
                    </button>
                </div>

            </div>

            <div class="mt-3">
                <a th:href="@{/products}"
                   class="btn btn-outline-secondary btn-sm">
                    Xóa bộ lọc
                </a>
            </div>
        </form>

        <div th:if="${productPage.isEmpty()}"
             class="alert alert-info text-center">
            Không tìm thấy sản phẩm phù hợp.
        </div>

        <div class="row g-4">

            <div class="col-md-6 col-lg-4"
                 th:each="product : ${productPage.content}">

                <div class="card product-card shadow-sm h-100">

                    <img
                        th:if="${product.thumbnail != null and #strings.startsWith(product.thumbnail, '/uploads')}"
                        th:src="@{${product.thumbnail}}"
                        th:alt="${product.name}"
						loading="lazy"
                        class="product-image card-img-top">

                    <div
                        th:if="${product.thumbnail == null or !#strings.startsWith(product.thumbnail, '/uploads')}"
                        class="no-product-image">
                        Chưa có ảnh
                    </div>

                    <div class="card-body d-flex flex-column">

                        <p class="text-muted small mb-2"
                           th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}">
                        </p>

                        <h5 class="card-title" th:text="${product.name}"></h5>

                        <p class="card-text text-muted product-description"
                           th:text="${product.description}"></p>

                        <div class="mt-auto">

                            <p class="text-decoration-line-through text-muted mb-1"
                               th:if="${product.discountPrice != null and product.discountPrice > 0}"
                               th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            </p>

                            <h5 class="text-danger fw-bold"
                                th:text="${#numbers.formatDecimal(product.discountPrice != null and product.discountPrice > 0 ? product.discountPrice : product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            </h5>

							<a th:href="@{/products/{id}(id=${product.id})}"
							    class="btn btn-primary w-100">

							    Xem chi tiết
							</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <nav th:if="${productPage.totalPages > 1}"
             class="mt-5"
             aria-label="Phân trang sản phẩm">

            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:classappend="${!productPage.hasPrevious()} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/products(page=${productPage.number - 1}, keyword=${keyword}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                        Trước
                    </a>
                </li>

                <li class="page-item"
                    th:each="pageNumber : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                    th:classappend="${pageNumber == productPage.number} ? 'active'">

                    <a class="page-link"
                       th:href="@{/products(page=${pageNumber}, keyword=${keyword}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
                       th:text="${pageNumber + 1}">
                    </a>
                </li>

                <li class="page-item"
                    th:classappend="${!productPage.hasNext()} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/products(page=${productPage.number + 1}, keyword=${keyword}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                        Sau
                    </a>
                </li>

            </ul>
        </nav>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
