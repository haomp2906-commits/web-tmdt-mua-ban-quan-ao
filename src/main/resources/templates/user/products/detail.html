<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${product.name} + ' - Rùa Fashion Store'">
        Chi tiết sản phẩm
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <a th:href="@{/products}"
           class="btn btn-outline-secondary btn-sm mb-4">

            ← Quay lại danh sách sản phẩm
        </a>

        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <div class="row g-5">

            <div class="col-lg-6">

                <img
                    id="mainProductImage"
                    th:if="${product.thumbnail != null
                        and #strings.startsWith(product.thumbnail, '/uploads')}"
                    th:src="@{${product.thumbnail}}"
                    th:alt="${product.name}"
                    class="detail-main-image">

                <div
                    th:if="${product.thumbnail == null
                        or !#strings.startsWith(product.thumbnail, '/uploads')}"
                    class="detail-no-image">

                    Chưa có ảnh sản phẩm
                </div>

                <div
                    class="product-image-gallery mt-3"
                    th:if="${not #lists.isEmpty(productImages)}">

                    <button
                        type="button"
                        class="thumbnail-button"
                        th:each="image : ${productImages}"
                        th:if="${image.imageUrl != null
                            and #strings.startsWith(image.imageUrl, '/uploads')}"
                        th:data-image="@{${image.imageUrl}}"
                        onclick="showImage(this.dataset.image)">

                        <img
                            th:src="@{${image.imageUrl}}"
                            th:alt="${product.name}">
                    </button>
                </div>

            </div>

            <div class="col-lg-6">

                <p
                    class="text-primary fw-semibold mb-2"
                    th:text="${product.category != null
                        ? product.category.name
                        : 'Chưa phân loại'}">
                </p>

                <h1 class="mb-3" th:text="${product.name}"></h1>

                <p
                    class="text-muted fs-5"
                    th:text="${product.description}">
                </p>

                <p
                    class="mb-2"
                    th:if="${product.brand != null
                        and !product.brand.isEmpty()}">

                    <strong>Thương hiệu:</strong>
                    <span th:text="${product.brand}"></span>
                </p>

                <p
                    class="mb-4"
                    th:if="${product.material != null
                        and !product.material.isEmpty()}">

                    <strong>Chất liệu:</strong>
                    <span th:text="${product.material}"></span>
                </p>

                <p
                    class="text-decoration-line-through text-muted fs-5 mb-1"
                    th:if="${product.discountPrice != null
                        and product.discountPrice > 0}"
                    th:text="${#numbers.formatDecimal(
                        product.price,
                        0,
                        'COMMA',
                        0,
                        'POINT'
                    )} + ' đ'">
                </p>

                <h2
                    class="text-danger fw-bold mb-4"
                    th:text="${#numbers.formatDecimal(
                        product.discountPrice != null
                        and product.discountPrice > 0
                        ? product.discountPrice
                        : product.price,
                        0,
                        'COMMA',
                        0,
                        'POINT'
                    )} + ' đ'">
                </h2>

                <div
                    th:if="${#lists.isEmpty(productSizes)}"
                    class="alert alert-warning">

                    Sản phẩm hiện đã hết hàng.
                </div>

                <form
                    th:unless="${#lists.isEmpty(productSizes)}"
                    th:action="@{/cart/add}"
                    method="post">

                    <input
                        type="hidden"
                        name="productId"
                        th:value="${product.id}">

                    <div class="mb-3">
                        <label
                            for="productSizeId"
                            class="form-label fw-semibold">

                            Chọn size và màu sắc
                        </label>

                        <select
                            id="productSizeId"
                            name="productSizeId"
                            class="form-select"
                            required
                            onchange="updateStock()">

                            <option value="" selected disabled>
                                -- Chọn size và màu --
                            </option>

                            <option
                                th:each="variant : ${productSizes}"
                                th:value="${variant.id}"
                                th:data-stock="${variant.quantity}"
                                th:text="${variant.size.name
                                    + ' - '
                                    + variant.color
                                    + ' (Còn '
                                    + variant.quantity
                                    + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label
                            for="quantity"
                            class="form-label fw-semibold">

                            Số lượng
                        </label>

                        <input
                            id="quantity"
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="1"
                            min="1"
                            required>

                        <small
                            id="stockMessage"
                            class="text-muted">
                            Vui lòng chọn size và màu.
                        </small>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100">

                        Thêm vào giỏ hàng
                    </button>
                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        function showImage(imageUrl) {
            const mainImage = document.getElementById("mainProductImage");

            if (mainImage) {
                mainImage.src = imageUrl;
            }
        }

        function updateStock() {
            const variantSelect =
                    document.getElementById("productSizeId");

            const quantityInput =
                    document.getElementById("quantity");

            const stockMessage =
                    document.getElementById("stockMessage");

            const selectedOption =
                    variantSelect.options[variantSelect.selectedIndex];

            const stock =
                    Number(selectedOption.dataset.stock || 0);

            if (stock > 0) {
                quantityInput.max = stock;

                if (Number(quantityInput.value) > stock) {
                    quantityInput.value = stock;
                }

                stockMessage.textContent =
                        "Còn " + stock + " sản phẩm.";
            }
        }
    </script>
</body>
</html>
