<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Giỏ hàng - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <h1 class="text-center mb-4">Giỏ hàng của bạn</h1>

        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <div
            th:if="${#lists.isEmpty(cartItems)}"
            class="text-center py-5">

            <p class="fs-5 text-muted">
                Giỏ hàng của bạn đang trống.
            </p>

            <a th:href="@{/products}" class="btn btn-primary btn-lg">
                Xem sản phẩm
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(cartItems)}">

            <div class="table-responsive bg-white rounded shadow-sm p-3">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Biến thể</th>
                            <th>Đơn giá</th>
                            <th style="width: 190px;">Số lượng</th>
                            <th>Thành tiền</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr
                            th:each="item : ${cartItems}"
                            th:with="unitPrice=${(item.product.discountPrice != null and item.product.discountPrice > 0) ? item.product.discountPrice : item.product.price}">

                            <td>
                                <div class="d-flex align-items-center">

                                    <img
                                        th:if="${item.product.thumbnail != null
                                            and #strings.startsWith(item.product.thumbnail, '/uploads')}"
                                        th:src="@{${item.product.thumbnail}}"
                                        th:alt="${item.product.name}"
                                        class="cart-item-image me-3">

                                    <div
                                        th:if="${item.product.thumbnail == null
                                            or !#strings.startsWith(item.product.thumbnail, '/uploads')}"
                                        class="cart-item-no-image me-3">

                                        Ảnh
                                    </div>

                                    <div>
                                        <p
                                            class="fw-semibold mb-0"
                                            th:text="${item.product.name}">
                                        </p>

                                        <small
                                            class="text-muted"
                                            th:text="${item.product.category != null
                                                ? item.product.category.name
                                                : 'Chưa phân loại'}">
                                        </small>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <span
                                    th:text="${item.productSize.size.name
                                        + ' - '
                                        + item.productSize.color}">
                                </span>
                            </td>

                            <td>
                                <span
                                    th:text="${#numbers.formatDecimal(
                                        unitPrice,
                                        0,
                                        'COMMA',
                                        0,
                                        'POINT'
                                    )} + ' đ'">
                                </span>
                            </td>

                            <td>
                                <form
                                    th:action="@{/cart/update}"
                                    method="post"
                                    class="d-flex align-items-center">

                                    <input
                                        type="hidden"
                                        name="cartItemId"
                                        th:value="${item.id}">

                                    <input
                                        type="number"
                                        name="quantity"
                                        class="form-control form-control-sm me-2"
                                        min="1"
                                        th:value="${item.quantity}"
                                        style="width: 80px;">

                                    <button
                                        type="submit"
                                        class="btn btn-outline-primary btn-sm">

                                        Cập nhật
                                    </button>
                                </form>
                            </td>

                            <td class="fw-semibold text-danger">
                                <span
                                    th:text="${#numbers.formatDecimal(
                                        unitPrice * item.quantity,
                                        0,
                                        'COMMA',
                                        0,
                                        'POINT'
                                    )} + ' đ'">
                                </span>
                            </td>

                            <td>
                                <form
                                    th:action="@{/cart/delete}"
                                    method="post">

                                    <input
                                        type="hidden"
                                        name="cartItemId"
                                        th:value="${item.id}">

                                    <button
                                        type="submit"
                                        class="btn btn-outline-danger btn-sm">

                                        Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <div
                    class="bg-white rounded shadow-sm p-4"
                    style="min-width: 320px;">

                    <div class="d-flex justify-content-between fs-5 fw-semibold">
                        <span>Tổng tiền:</span>

                        <span
                            class="text-danger"
                            th:text="${#numbers.formatDecimal(
                                cartTotal,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            )} + ' đ'">
                        </span>
                    </div>

					<a th:href="@{/checkout}"
					   class="btn btn-primary w-100 mt-3">

					    Tiến hành đặt hàng
					</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
