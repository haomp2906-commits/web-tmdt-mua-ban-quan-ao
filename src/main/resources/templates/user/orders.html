<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lịch sử đơn hàng - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <h1 class="text-center mb-4">Lịch sử đơn hàng</h1>

        <div
            th:if="${#lists.isEmpty(orders)}"
            class="text-center py-5">

            <p class="fs-5 text-muted">
                Bạn chưa có đơn hàng nào.
            </p>

            <a th:href="@{/products}" class="btn btn-primary btn-lg">
                Xem sản phẩm
            </a>
        </div>

        <div th:each="order : ${orders}" class="card mb-4 shadow-sm">

            <div
                class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">

                <div>
                    <strong th:text="${'Đơn #' + order.id}"></strong>

                    <small
                        class="text-muted ms-2"
                        th:text="${#temporals.format(
                            order.createdAt,
                            'dd/MM/yyyy HH:mm'
                        )}">
                    </small>
                </div>

                <div class="d-flex align-items-center gap-3">

                    <span
                        th:if="${order.status == 'PENDING'}"
                        class="badge text-bg-warning">

                        Chờ xử lý
                    </span>

                    <span
                        th:if="${order.status == 'SHIPPING'}"
                        class="badge text-bg-primary">

                        Đang giao hàng
                    </span>

                    <span
                        th:if="${order.status == 'COMPLETED'}"
                        class="badge text-bg-success">

                        Hoàn thành
                    </span>

                    <span
                        th:if="${order.status == 'CANCELLED'}"
                        class="badge text-bg-danger">

                        Đã hủy
                    </span>

                    <strong
                        class="text-danger"
                        th:text="${#numbers.formatDecimal(
                            order.totalAmount,
                            0,
                            'COMMA',
                            0,
                            'POINT'
                        )} + ' đ'">
                    </strong>
                </div>
            </div>

            <div class="card-body">

                <p class="mb-1">
                    <strong>Người nhận:</strong>
                    <span th:text="${order.recipientName}"></span>
                    -
                    <span th:text="${order.recipientPhone}"></span>
                </p>

                <p class="mb-3">
                    <strong>Địa chỉ:</strong>
                    <span th:text="${order.shippingAddress}"></span>
                </p>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Biến thể</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Thành tiền</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="detail : ${order.details}">
                                <td th:text="${detail.product.name}"></td>

                                <td
                                    th:text="${detail.productSize.size.name
                                        + ' - '
                                        + detail.productSize.color}">
                                </td>

                                <td
                                    th:text="${#numbers.formatDecimal(
                                        detail.price,
                                        0,
                                        'COMMA',
                                        0,
                                        'POINT'
                                    )} + ' đ'">
                                </td>

                                <td th:text="${detail.quantity}"></td>

                                <td class="fw-semibold"
                                    th:text="${#numbers.formatDecimal(
                                        detail.price * detail.quantity,
                                        0,
                                        'COMMA',
                                        0,
                                        'POINT'
                                    )} + ' đ'">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
