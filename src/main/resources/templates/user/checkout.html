<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thanh toán - Rùa Fashion Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">

        <div class="mb-4">
            <a th:href="@{/cart}"
               class="btn btn-outline-secondary btn-sm">

                ← Quay lại giỏ hàng
            </a>
        </div>

        <div class="text-center mb-5">
            <h1>Thanh toán</h1>

            <p class="text-muted">
                Nhập thông tin giao hàng để hoàn tất đơn hàng.
            </p>
        </div>

        <div class="row g-4">

            <div class="col-lg-7">

                <div class="bg-white rounded shadow-sm p-4">
                    <h4 class="mb-4">Thông tin giao hàng</h4>

                    <form th:action="@{/checkout}" method="post">

                        <div class="mb-3">
                            <label
                                for="recipientName"
                                class="form-label">

                                Họ và tên người nhận
                            </label>

                            <input
                                id="recipientName"
                                type="text"
                                name="recipientName"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label
                                for="recipientPhone"
                                class="form-label">

                                Số điện thoại
                            </label>

                            <input
                                id="recipientPhone"
                                type="text"
                                name="recipientPhone"
                                class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label
                                for="shippingAddress"
                                class="form-label">

                                Địa chỉ giao hàng
                            </label>

                            <textarea
                                id="shippingAddress"
                                name="shippingAddress"
                                class="form-control"
                                rows="3"
                                required>
                            </textarea>
                        </div>

                        <div class="mb-4">
                            <label
                                for="note"
                                class="form-label">

                                Ghi chú
                            </label>

                            <textarea
                                id="note"
                                name="note"
                                class="form-control"
                                rows="3"
                                placeholder="Ví dụ: Giao giờ hành chính">
                            </textarea>
                        </div>

                        <div class="border rounded p-3 mb-4 bg-light">
                            <p class="fw-semibold mb-1">
                                Phương thức thanh toán
                            </p>

                            <p class="mb-0">
                                Thanh toán khi nhận hàng (COD)
                            </p>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100">

                            Xác nhận đặt hàng
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">

                <div class="bg-white rounded shadow-sm p-4">
                    <h4 class="mb-4">Đơn hàng của bạn</h4>

                    <div
                        class="border-bottom pb-3 mb-3"
                        th:each="item : ${cartItems}"
                        th:with="unitPrice=${(item.product.discountPrice != null and item.product.discountPrice > 0) ? item.product.discountPrice : item.product.price}">

                        <div class="d-flex justify-content-between">
                            <div class="me-3">
                                <p
                                    class="fw-semibold mb-1"
                                    th:text="${item.product.name}">
                                </p>

                                <small
                                    class="text-muted"
                                    th:text="${item.productSize.size.name
                                        + ' - '
                                        + item.productSize.color
                                        + ' × '
                                        + item.quantity}">
                                </small>
                            </div>

                            <span
                                class="fw-semibold text-danger text-nowrap"
                                th:text="${#numbers.formatDecimal(
                                    unitPrice * item.quantity,
                                    0,
                                    'COMMA',
                                    0,
                                    'POINT'
                                )} + ' đ'">
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Tổng tiền:</span>

                        <span
                            class="text-danger"
                            th:text="${#numbers.formatDecimal(
                                cartTotal,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            )} + ' đ'">
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
